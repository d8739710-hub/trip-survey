<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 部門年度旅遊 - 時間意願調查 ✈️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind CDN safelist：確保動態注入的 class 被掃描到 -->
  <div class="hidden
    bg-green-100 border-green-400 text-green-700 ring-2 ring-green-300 hover:bg-green-50
    bg-yellow-100 border-yellow-400 text-yellow-700 ring-2 ring-yellow-300 hover:bg-yellow-50
    bg-red-100 border-red-400 text-red-700 ring-2 ring-red-300 hover:bg-red-50
    bg-green-500 bg-yellow-400 bg-red-400
    bg-green-50 bg-yellow-50 bg-red-50
    rotate-180">
  </div>
</head>
<body class="bg-gradient-to-br from-sky-50 via-white to-emerald-50 min-h-screen font-sans antialiased">

  <!-- Hero Header -->
  <header class="bg-gradient-to-r from-sky-500 to-emerald-500 text-white py-10 px-4 text-center shadow-lg">
    <div class="text-5xl mb-3">✈️</div>
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-1">2026 部門年度旅遊</h1>
    <h2 class="text-lg md:text-xl font-semibold opacity-90 mb-4">時間意願調查</h2>
    <p class="max-w-md mx-auto text-sky-100 text-sm md:text-base leading-relaxed">
      請大家勾選自己方便的時間，方便統計最適合的出遊日期！🗓️
    </p>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

    <!-- Survey Form -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-2">
        <span class="w-7 h-7 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center text-sm font-bold">1</span>
        填寫你的意願
      </h3>

      <form id="surveyForm" novalidate>
        <!-- Name -->
        <div class="mb-6">
          <label for="nameInput" class="block text-sm font-semibold text-gray-700 mb-1.5">
            姓名 / 暱稱 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="nameInput"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 placeholder-gray-400
                   focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition"
            placeholder="請輸入您的姓名或暱稱" />
          <p id="nameError" class="text-red-500 text-xs mt-1 hidden">請填寫姓名</p>
        </div>

        <!-- Date Cards -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">
            可參加日期 <span class="text-red-500">*</span>
          </label>
          <p class="text-xs text-gray-400 mb-3">每個日期都請選擇一個意願選項</p>
          <div id="dateCards" class="space-y-3"></div>
          <p id="dateError" class="text-red-500 text-xs mt-2 hidden"></p>
        </div>

        <!-- Notes -->
        <div class="mb-6">
          <label for="notesInput" class="block text-sm font-semibold text-gray-700 mb-1.5">
            備註 / 建議
            <span class="text-gray-400 font-normal ml-1">(選填)</span>
          </label>
          <textarea id="notesInput" rows="3"
            class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 placeholder-gray-400
                   focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition resize-none"
            placeholder="想去的地點、飲食限制、其他建議…"></textarea>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-gradient-to-r from-sky-500 to-emerald-500 hover:from-sky-600 hover:to-emerald-600
                 active:scale-95 text-white font-bold py-3 px-6 rounded-xl transition-all shadow hover:shadow-md">
          送出我的意願 🚀
        </button>
      </form>
    </section>

    <!-- Success Toast -->
    <div id="successMsg"
      class="hidden bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-5 text-center animate-pulse">
      <div class="text-3xl mb-1">🎉</div>
      <p class="text-emerald-700 font-bold">感謝您的填寫！統計結果已即時更新。</p>
    </div>

    <!-- Results -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span class="text-xl">📊</span> 目前統計結果
        </h3>
        <span id="totalCount" class="text-xs bg-sky-50 text-sky-600 font-semibold px-3 py-1 rounded-full">
          0 人填寫
        </span>
      </div>

      <div id="resultsArea" class="space-y-3"></div>

      <div class="mt-5 pt-4 border-t border-gray-100 flex items-center justify-between">
        <p id="lastUpdated" class="text-xs text-gray-400">載入中…</p>
        <div class="flex items-center gap-3">
          <button id="refreshBtn"
            class="text-xs text-sky-500 hover:text-sky-700 transition underline underline-offset-2">
            🔄 重新整理
          </button>
          <button id="clearBtn"
            class="text-xs text-gray-400 hover:text-red-400 transition underline underline-offset-2">
            🗑 清除資料
          </button>
        </div>
      </div>
    </section>



    <p class="text-center text-xs text-gray-400 pb-4">🏝️ 期待與大家一起出發！</p>
  </main>

  <script>
    /* ── 設定區 ── */

    const DATES = [
      { id: 'd1',  label: '9/26 (六) − 9/29 (二)',    badge: '' },
      { id: 'd2',  label: '10/1 (四) − 10/4 (日)',    badge: '' },
      { id: 'd3',  label: '10/3 (六) − 10/6 (二)',    badge: '' },
      { id: 'd4',  label: '10/8 (四) − 10/11 (日)',   badge: '國慶連假' },
      { id: 'd5',  label: '10/10 (六) − 10/13 (二)',  badge: '國慶連假' },
      { id: 'd6',  label: '10/15 (四) − 10/18 (日)',  badge: '' },
      { id: 'd7',  label: '10/17 (六) − 10/20 (二)',  badge: '' },
      { id: 'd8',  label: '10/22 (四) − 10/25 (日)',  badge: '' },
      { id: 'd9',  label: '10/24 (六) − 10/27 (二)',  badge: '' },
      { id: 'd10', label: '10/29 (四) − 11/1 (日)',   badge: '' },
      { id: 'd11', label: '10/31 (六) − 11/3 (二)',   badge: '' },
      { id: 'd12', label: '11/5 (四) − 11/8 (日)',    badge: '' },
      { id: 'd13', label: '11/7 (六) − 11/10 (二)',   badge: '' },
      { id: 'd14', label: '11/12 (四) − 11/15 (日)',  badge: '' },
      { id: 'd15', label: '11/14 (六) − 11/17 (二)',  badge: '' },
      { id: 'd16', label: '11/19 (四) − 11/22 (日)',  badge: '' },
      { id: 'd17', label: '11/21 (六) − 11/24 (二)',  badge: '' },
      { id: 'd18', label: '11/26 (四) − 11/29 (日)',  badge: '' },
      { id: 'd19', label: '11/28 (六) − 12/1 (二)',   badge: '' },
      { id: 'd20', label: '12/3 (四) − 12/6 (日)',    badge: '' },
      { id: 'd21', label: '12/5 (六) − 12/8 (二)',    badge: '' },
    ];

    const OPTIONS = [
      {
        value: 'yes',
        label: '非常可以', emoji: '🟢',
        active:   'bg-green-100 border-green-400 text-green-700 ring-2 ring-green-300',
        inactive: 'bg-white border-gray-200 text-gray-500 hover:bg-green-50 hover:border-green-300',
      },
      {
        value: 'maybe',
        label: '勉強可以', emoji: '🟡',
        active:   'bg-yellow-100 border-yellow-400 text-yellow-700 ring-2 ring-yellow-300',
        inactive: 'bg-white border-gray-200 text-gray-500 hover:bg-yellow-50 hover:border-yellow-300',
      },
      {
        value: 'no',
        label: '完全不行', emoji: '🔴',
        active:   'bg-red-100 border-red-400 text-red-700 ring-2 ring-red-300',
        inactive: 'bg-white border-gray-200 text-gray-500 hover:bg-red-50 hover:border-red-300',
      },
    ];

    /* ── 狀態 ── */
    const selections = {}; // { d1: 'yes', d2: 'maybe', … }

    /* ── HTML escape ── */
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    /* ── API helpers ── */
    async function fetchResponses() {
      const r = await fetch('/api/responses');
      if (!r.ok) throw new Error('fetch failed');
      return r.json();
    }
    async function submitResponse(data) {
      const r = await fetch('/api/response', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!r.ok) throw new Error('submit failed');
      return r.json();
    }

    /* ── 建立日期卡片 ── */
    function buildDateCards() {
      const container = document.getElementById('dateCards');
      container.innerHTML = DATES.map(date => `
        <div class="border-2 border-gray-100 rounded-xl p-3.5 hover:border-sky-200 transition-colors">
          <div class="flex flex-wrap items-center justify-between gap-y-2 gap-x-3">
            <div class="flex items-center gap-2 min-w-0">
              <span class="font-semibold text-gray-800 text-sm">${date.label}</span>
              ${date.badge
                ? `<span class="shrink-0 text-xs text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200">${date.badge}</span>`
                : ''}
            </div>
            <div class="flex gap-1.5 flex-wrap">
              ${OPTIONS.map(opt => `
                <button type="button"
                  data-date="${date.id}" data-val="${opt.value}"
                  class="option-btn border-2 rounded-lg px-2.5 py-1 text-xs font-semibold transition-all ${opt.inactive}"
                  onclick="selectOption('${date.id}','${opt.value}')">
                  ${opt.emoji} ${opt.label}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    /* ── 選擇某日期的意願 ── */
    function selectOption(dateId, value) {
      selections[dateId] = value;
      OPTIONS.forEach(opt => {
        const btn = document.querySelector(`button[data-date="${dateId}"][data-val="${opt.value}"]`);
        if (!btn) return;
        btn.className = `option-btn border-2 rounded-lg px-2.5 py-1 text-xs font-semibold transition-all ${
          opt.value === value ? opt.active : opt.inactive
        }`;
      });
    }

    /* ── 展開 / 收合名單 ── */
    function toggleDetail(dateId) {
      document.getElementById(`detail-${dateId}`).classList.toggle('hidden');
      document.getElementById(`arrow-${dateId}`).classList.toggle('rotate-180');
    }

    /* ── 渲染統計結果 ── */
    async function renderResults() {
      const area = document.getElementById('resultsArea');
      let responses;
      try {
        responses = await fetchResponses();
      } catch {
        area.innerHTML = '<p class="text-red-400 text-center py-6 text-sm">⚠️ 無法連線至伺服器，請確認 server.py 是否執行中。</p>';
        document.getElementById('lastUpdated').textContent = '連線失敗';
        return;
      }
      document.getElementById('totalCount').textContent = `${responses.length} 人填寫`;
      document.getElementById('lastUpdated').textContent = `更新：${new Date().toLocaleTimeString('zh-TW')}`;

      if (responses.length === 0) {
        area.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">尚無填寫資料，成為第一個送出的人吧！</p>';
        return;
      }

      area.innerHTML = DATES.map(date => {
        const counts = { yes: 0, maybe: 0, no: 0 };
        const names  = { yes: [], maybe: [], no: [] };

        responses.forEach(r => {
          const v = r.selections?.[date.id];
          if (v && v in counts) { counts[v]++; names[v].push(r.name); }
        });

        const available = counts.yes + counts.maybe;
        const total     = responses.length;
        const ratio     = available / total;

        const badgeCls = ratio >= 0.7
          ? 'bg-green-100 text-green-700'
          : ratio >= 0.4
            ? 'bg-yellow-100 text-yellow-700'
            : 'bg-red-100 text-red-600';

        const bars = [
          { label: '非常可以', emoji: '🟢', color: 'bg-green-500',  count: counts.yes   },
          { label: '勉強可以', emoji: '🟡', color: 'bg-yellow-400', count: counts.maybe },
          { label: '完全不行', emoji: '🔴', color: 'bg-red-400',    count: counts.no    },
        ].map(b => {
          const pct = total ? Math.round(b.count / total * 100) : 0;
          return `
            <div class="flex items-center gap-2 text-xs">
              <span class="w-[5.5rem] text-gray-600 shrink-0">${b.emoji} ${b.label}</span>
              <div class="flex-1 bg-gray-100 rounded-full h-3.5 overflow-hidden">
                <div class="${b.color} h-3.5 rounded-full" style="width:${pct}%;transition:width .5s ease"></div>
              </div>
              <span class="w-8 text-right text-gray-500 shrink-0">${b.count}</span>
            </div>`;
        }).join('');

        const nameGroups = [
          { key:'yes',   label:'非常可以 🟢', cls:'text-green-700 bg-green-50 border border-green-200'   },
          { key:'maybe', label:'勉強可以 🟡', cls:'text-yellow-700 bg-yellow-50 border border-yellow-200' },
          { key:'no',    label:'完全不行 🔴', cls:'text-red-600 bg-red-50 border border-red-200'          },
        ].filter(g => names[g.key].length > 0).map(g => `
          <div class="flex flex-wrap items-center gap-1">
            <span class="text-gray-500 text-xs mr-1">${g.label}：</span>
            ${names[g.key].map(n =>
              `<span class="text-xs ${g.cls} px-2 py-0.5 rounded-full">${esc(n)}</span>`
            ).join('')}
          </div>`).join('');

        return `
          <div class="border border-gray-100 rounded-xl overflow-hidden">
            <!-- 標題列（可點擊展開）-->
            <button type="button"
              class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-gray-100 transition text-left"
              onclick="toggleDetail('${date.id}')">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-gray-800 text-sm">${date.label}</span>
                <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${badgeCls}">
                  ${available}/${total} 人可出發
                </span>
              </div>
              <svg id="arrow-${date.id}"
                class="w-4 h-4 text-gray-400 transition-transform duration-200 shrink-0 ml-2"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- 進度條 -->
            <div class="px-4 py-3 space-y-2">${bars}</div>

            <!-- 展開名單 -->
            <div id="detail-${date.id}" class="hidden">
              <div class="px-4 pb-3 border-t border-gray-100 pt-3 space-y-1.5">
                ${nameGroups || '<p class="text-gray-400 text-xs">尚無人填寫此日期</p>'}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    /* ── 表單送出 ── */
    document.getElementById('surveyForm').addEventListener('submit', async e => {
      e.preventDefault();

      const name = document.getElementById('nameInput').value.trim();
      const nameErr = document.getElementById('nameError');
      if (!name) { nameErr.classList.remove('hidden'); document.getElementById('nameInput').focus(); return; }
      nameErr.classList.add('hidden');

      const unanswered = DATES.filter(d => !selections[d.id]);
      const dateErr = document.getElementById('dateError');
      if (unanswered.length > 0) {
        dateErr.textContent = `請為以下日期選擇意願：${unanswered.map(d => d.label).join('、')}`;
        dateErr.classList.remove('hidden');
        return;
      }
      dateErr.classList.add('hidden');

      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = '送出中…';

      try {
        await submitResponse({
          name,
          selections: { ...selections },
          notes: document.getElementById('notesInput').value.trim(),
        });

        document.getElementById('surveyForm').reset();
        DATES.forEach(d => delete selections[d.id]);
        buildDateCards();

        const msg = document.getElementById('successMsg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 3000);

        await renderResults();
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch {
        alert('送出失敗，請確認伺服器是否執行中。');
      } finally {
        btn.disabled = false;
        btn.textContent = '送出我的意願 🚀';
      }
    });

    /* ── 重整按鈕 ── */
    document.getElementById('refreshBtn').addEventListener('click', renderResults);

    /* ── 清除資料（需輸入確認文字）── */
    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (prompt('輸入「確認清除」以刪除所有填寫資料：') === '確認清除') {
        await fetch('/api/responses', { method: 'DELETE' });
        renderResults();
      }
    });

    /* ── 每 15 秒自動更新結果 ── */
    setInterval(renderResults, 15000);

    /* ── 初始化 ── */
    buildDateCards();
    renderResults();
  </script>
</body>
</html>
